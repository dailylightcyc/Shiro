x-cms-env: &cms-env
  NODE_ENV: production
  TZ: Asia/Shanghai
  PORT: '2333'
  PG_HOST: postgres
  PG_PORT: '5432'
  PG_USER: ${PG_USER:-shiro}
  PG_PASSWORD: ${PG_PASSWORD:?Run scripts/prepare-stack.mjs first}
  PG_DATABASE: ${PG_DATABASE:-mx_core}
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  SNOWFLAKE_WORKER_ID: ${SNOWFLAKE_WORKER_ID:-1}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  ENCRYPT_ENABLE: 'true'
  ENCRYPT_KEY: ${ENCRYPT_KEY:?ENCRYPT_KEY is required}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-localhost:*,127.0.0.1:*}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 1
    environment:
      POSTGRES_USER: ${PG_USER:-shiro}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE:-mx_core}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    image: ${MX_CMS_IMAGE:-innei/mx-server:14.15.2}
    command: ['node', 'migrate.mjs']
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    environment: *cms-env
    volumes:
      - cms-data:/root/.mx-space
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'
  cms:
    image: ${MX_CMS_IMAGE:-innei/mx-server:14.15.2}
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    environment: *cms-env
    volumes:
      - cms-data:/root/.mx-space
    ports:
      - '${CMS_BIND:-127.0.0.1}:${CMS_PORT:-2333}:2333'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:2333/api/v3/ping']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  shiro:
    profiles: [production]
    image: ${SHIRO_IMAGE:-shiro:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    environment:
      PORT: '2323'
      HOSTNAME: '0.0.0.0'
      NEXT_PUBLIC_API_URL: http://cms:2333/api/v3
      NEXT_PUBLIC_CLIENT_API_URL: /api/v3
      NEXT_PUBLIC_GATEWAY_URL: ${PUBLIC_WEB_URL:-http://localhost:2323}
      NEXT_PUBLIC_CMS_ADMIN_URL: ${PUBLIC_WEB_URL:-http://localhost:2323}/proxy/qaqdmin
      GH_TOKEN: ${GH_TOKEN:-}
      SHIRO_GITHUB_CACHE_DIR: /app/cache/github
    volumes:
      - github-cache:/app/cache/github
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:2323/setup").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      cms:
        condition: service_healthy
  gateway:
    profiles: [production]
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    ports:
      - '${WEB_BIND:-0.0.0.0}:${WEB_PORT:-2323}:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      shiro:
        condition: service_healthy
      cms:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1/setup']
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  cms-data:
  github-cache:
