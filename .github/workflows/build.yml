name: Production build (2 GiB)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.3.4
          run_install: false

      - name: Install locked dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=512
        run: pnpm install --frozen-lockfile --child-concurrency=1 --network-concurrency=4

      - name: Test with one worker
        env:
          NODE_OPTIONS: --max-old-space-size=512
        run: pnpm --filter @shiro/web exec vitest run --maxWorkers=1 --no-file-parallelism

      - name: Cold build under a 2 GiB cgroup, without swap
        run: |
          mkdir -p .runtime
          sudo systemd-run --wait --pipe --collect \
            --uid="$(id -u)" --gid="$(id -g)" \
            --working-directory="$PWD" \
            --property=MemoryMax=2048M \
            --property=MemorySwapMax=0 \
            --property=CPUQuota=200% \
            /usr/bin/env PATH="$PATH" \
            SHIRO_MEMORY_SCOPE=1 SHIRO_REQUIRE_CGROUP=1 \
            SHIRO_MEMORY_MB=2048 SHIRO_HEAP_MB=1408 SHIRO_BUNDLER=webpack \
            "$(command -v node)" scripts/run-next.mjs build \
            2>&1 | tee .runtime/ci-build.log

      - name: Package verified standalone artifacts
        run: node scripts/package-build.mjs

      - name: Upload production artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shiro-linux-x64-${{ github.sha }}
          path: |
            build/shiro-standalone.tar.gz
            build/shiro-standalone.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload memory report and build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-memory-${{ github.sha }}
          path: |
            .runtime/build-result.json
            .runtime/ci-build.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
